[project]
name = "licet"
version = "0.1.0"
description = "Autonomous browser agent for Accela Citizen Access permitting portals"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "openai>=2.0",
    "solari-browser>=0.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["licet*", "licetbench*"]

[tool.setuptools.package-data]
licetbench = ["*.json"]
"licet.agent" = ["*.md"]
